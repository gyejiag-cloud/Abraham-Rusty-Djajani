name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare static Pages output
        run: |
          mkdir -p .pages-output
          cp abraham-rusty-djajani-stealth-fintech.html .pages-output/index.html
          cp _headers .pages-output/_headers

      - name: Deploy production site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy .pages-output
          --project-name=joinglippy
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-dirty=false
